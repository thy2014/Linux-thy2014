name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux / system Python + Xvfb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk, Pillow and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-pil xvfb
      - name: Show runtime
        run: python3 --version && python3 -c "import tkinter, PIL; print('tk', tkinter.TkVersion, 'pillow', PIL.__version__)"
      - name: Run unittest suite
        run: xvfb-run -a python3 -m unittest discover -s tests -v
